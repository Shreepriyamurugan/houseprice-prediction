name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e .

      - name: Lint with ruff
        run: |
          ruff check src api tests --select E9,F63,F7,F82

      - name: Run pytest with coverage
        run: |
          pytest -q --cov=src/lifinity --cov=api --cov-report=term-missing

  docker:
    name: docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-serve.txt'

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install --no-deps -e .

      - name: Smoke model preparation
        run: |
          python scripts/ci_smoke_model.py

      - name: Build Docker image
        run: |
          docker build -t lifinity-api:latest .

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name lifinity-container lifinity-api:latest

      - name: Poll healthcheck endpoint (60s max)
        run: |
          for i in {1..12}; do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Container health check passed!"
              exit 0
            fi
            echo "Waiting for container health check ($i/12)..."
            sleep 5
          done
          echo "Health check timed out!"
          exit 1

      - name: Test prediction endpoint
        run: |
          RESPONSE=$(curl -s -X POST "http://localhost:8000/predict" -H "Content-Type: application/json" -d @api/sample_request.json)
          echo "Predict response: $RESPONSE"
          python -c "import json; res=json.loads('''$RESPONSE'''); assert res.get('predicted_price', 0) > 0, f'Prediction failed: {res}'"

      - name: Container logs & cleanup
        if: always()
        run: |
          docker logs lifinity-container || true
          docker rm -f lifinity-container || true
